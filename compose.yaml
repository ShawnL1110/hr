services:
  hr-app:
    build: .
    container_name: hr-app
    restart: unless-stopped
    env_file: .env
    environment:
      HR_DATA_DIR: /data
    volumes:
      - hr-data:/data
    networks:
      - kyc_default
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  hr-data:

networks:
  kyc_default:
    external: true
